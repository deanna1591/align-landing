<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Half iPhone lists view</title>

  <g transform="translate(140, 60)">
    <path d="M 56 0 L 464 0 Q 520 0 520 56 L 520 540 L 0 540 L 0 56 Q 0 0 56 0 Z" fill="#1B1B1B"/>
    <path d="M 64 14 L 456 14 Q 506 14 506 64 L 506 540 L 14 540 L 14 64 Q 14 14 64 14 Z" fill="#FFFFFF"/>
    <rect x="215" y="42" width="90" height="28" rx="14" fill="#1B1B1B"/>

    <g transform="translate(60, 110)">
      <text font-family="Inter Tight, sans-serif" font-size="14" fill="#7CA481" font-weight="500">← Back</text>
    </g>

    <g transform="translate(60, 170)">
      <text font-family="Fraunces, serif" font-size="44" font-weight="400" fill="#1B1813">My lists</text>
      <text x="200" y="-2" font-family="Inter Tight, sans-serif" font-size="14" fill="#9A917F">4</text>
      <text y="30" font-family="Inter Tight, sans-serif" font-size="14" fill="#9A917F" font-style="italic">categories that aren't days.</text>
    </g>

    <line x1="60" y1="240" x2="450" y2="240" stroke="#F2F2F2" stroke-width="0.5"/>

    <g transform="translate(60, 274)">
      <text font-family="Inter Tight, sans-serif" font-size="14" font-weight="700" fill="#1B1813" letter-spacing="0.05em">🛒 GROCERIES</text>
      <text x="0" y="32" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">paper towels</text>
      <text x="0" y="58" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">olive oil</text>
      <text x="0" y="84" font-family="Inter Tight, sans-serif" font-size="14" fill="#9A917F" text-decoration="line-through">eggs</text>
      <text x="0" y="110" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">basil</text>
    </g>

    <g transform="translate(60, 420)">
      <text font-family="Inter Tight, sans-serif" font-size="14" font-weight="700" fill="#1B1813" letter-spacing="0.05em">⚡ NEED FOCUS TIME</text>
      <text x="0" y="32" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Q3 strategy doc</text>
      <text x="0" y="58" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">prep board deck</text>
    </g>
