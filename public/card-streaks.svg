<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
  <title>Align streaks card</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1B1813" flood-opacity="0.10"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect width="600" height="540" rx="24" fill="#FFFFFF"/>
    <text x="300" y="80" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="13" fill="#5C5448" letter-spacing="0.22em" font-weight="600">YOUR STREAK</text>
    <g transform="translate(300, 260)">
      <text text-anchor="middle" font-family="Fraunces, serif" font-size="120" font-weight="500" fill="#C9824A">12</text>
      <text y="36" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="13" fill="#5C5448" letter-spacing="0.18em" font-weight="600">DAYS IN A ROW</text>
    </g>
    <g transform="translate(300, 390)">
      <g transform="translate(-120, 0)"><circle r="8" fill="#7CA481"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">MON</text></g>
      <g transform="translate(-80, 0)"><circle r="8" fill="#7CA481"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">TUE</text></g>
      <g transform="translate(-40, 0)"><circle r="8" fill="#7CA481"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">WED</text></g>
      <g transform="translate(0, 0)"><circle r="8" fill="none" stroke="#7CA481" stroke-width="1.5" stroke-dasharray="2 2"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">THU</text></g>
      <g transform="translate(40, 0)"><circle r="8" fill="#7CA481"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">FRI</text></g>
      <g transform="translate(80, 0)"><circle r="8" fill="#7CA481"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">SAT</text></g>
      <g transform="translate(120, 0)"><circle r="8" fill="#7CA481"/><text y="28" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F">SUN</text></g>
    </g>
    <text x="300" y="470" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="13" fill="#9A917F" font-style="italic">thursday off · streak survived</text>
  </g>
</svg>
