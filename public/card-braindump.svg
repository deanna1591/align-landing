<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540">
  <title>Align brain dump card</title>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#1B1813" flood-opacity="0.10"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <rect width="600" height="540" rx="24" fill="#FFFFFF"/>
    <g transform="translate(50, 80)">
      <text font-family="Fraunces, serif" font-size="36" font-weight="400" fill="#1B1813">Brain dump</text>
      <text y="32" font-family="Inter Tight, sans-serif" font-size="14" fill="#9A917F" font-style="italic">empty your head. sort later.</text>
    </g>
    <g transform="translate(50, 170)">
      <rect width="500" height="56" rx="14" fill="#FAFAFA" stroke="#EAEAEA" stroke-width="0.5"/>
      <text x="18" y="35" font-family="Inter Tight, sans-serif" font-size="17" fill="#7CA481" font-weight="500">+</text>
      <text x="38" y="36" font-family="Inter Tight, sans-serif" font-size="15" fill="#9A917F" font-style="italic">capture anything...</text>
      <g transform="translate(458, 20)">
        <circle cx="10" cy="10" r="11" fill="none" stroke="#5C5448" stroke-width="0.8"/>
        <rect x="8" y="6" width="4" height="6" rx="2" fill="none" stroke="#5C5448" stroke-width="0.8"/>
        <line x1="6" y1="13" x2="14" y2="13" stroke="#5C5448" stroke-width="0.6"/>
      </g>
    </g>
    <text x="50" y="276" font-family="Inter Tight, sans-serif" font-size="11" fill="#9A917F" letter-spacing="0.18em" font-weight="600">CAPTURED · 7 ITEMS</text>
    <g transform="translate(50, 306)"><circle cx="6" cy="8" r="4" fill="#7CA481"/><text x="22" y="12" font-family="Inter Tight, sans-serif" font-size="15" fill="#1B1813">call mom about Sunday</text><text x="22" y="30" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">2 min ago</text></g>
    <line x1="50" y1="356" x2="550" y2="356" stroke="#F2F2F2" stroke-width="0.5"/>
    <g transform="translate(50, 376)"><circle cx="6" cy="8" r="4" fill="#7CA481"/><text x="22" y="12" font-family="Inter Tight, sans-serif" font-size="15" fill="#1B1813">try ramen place on Mill</text><text x="22" y="30" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">today, 9:14 am</text></g>
    <line x1="50" y1="426" x2="550" y2="426" stroke="#F2F2F2" stroke-width="0.5"/>
    <g transform="translate(50, 446)"><circle cx="6" cy="8" r="4" fill="#7CA481"/><text x="22" y="12" font-family="Inter Tight, sans-serif" font-size="15" fill="#1B1813">renew library card</text><text x="22" y="30" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">yesterday</text></g>
  </g>
</svg>
