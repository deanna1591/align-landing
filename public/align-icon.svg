<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Align icon</title>
  <desc>Align app icon: italic lowercase a with a hand-drawn swoosh underline and two sparkles on a radial sage gradient.</desc>

  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#A8C5AB"/>
      <stop offset="100%" stop-color="#3C5B47"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <text x="100" y="148" text-anchor="middle"
        font-family="Fraunces, 'Times New Roman', serif"
        font-style="italic"
        font-weight="500"
        font-size="140"
        fill="#FFFFFF">a</text>

  <path d="M 42 168 C 70 160, 110 172, 150 162"
        stroke="#FFFFFF" stroke-width="4" fill="none"
        stroke-linecap="round"/>

  <path d="M0,-12 Q1.8,-2 12,0 Q1.8,2 0,12 Q-1.8,2 -12,0 Q-1.8,-2 0,-12 Z"
        transform="translate(156, 73) scale(1.5)" fill="#FFFFFF"/>

  <path d="M0,-12 Q1.8,-2 12,0 Q1.8,2 0,12 Q-1.8,2 -12,0 Q-1.8,-2 0,-12 Z"
        transform="translate(184, 43) scale(0.55)" fill="#FFFFFF"/>
</svg>
