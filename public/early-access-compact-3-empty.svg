<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700">
  <defs>
    <filter id="es-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="28" flood-color="#1B1813" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="600" height="700" fill="#F5F5F5"/>
  <g transform="translate(60, 70)" filter="url(#es-shadow)">
    <rect width="480" height="560" rx="20" fill="#FFFFFF"/>
    <g transform="translate(40, 50)">
      <text font-family="Fraunces, serif" font-style="italic" font-size="22" font-weight="500" fill="#1B1813">align</text>
      <text x="84" y="-2" font-family="Inter Tight, sans-serif" font-size="9" fill="#5C5448" letter-spacing="0.18em" font-weight="600">WED, MAY 13</text>
    </g>
    <line x1="40" y1="92" x2="440" y2="92" stroke="#F2F2F2" stroke-width="0.5"/>
    <g transform="translate(40, 130)">
      <text font-family="Fraunces, serif" font-size="32" font-weight="500" fill="#7CA481">Wednesday</text>
      <text x="380" y="-2" font-family="Inter Tight, sans-serif" font-size="10" fill="#7CA481" letter-spacing="0.18em" font-weight="600">MAY 13</text>
      <line x1="0" y1="14" x2="400" y2="14" stroke="#7CA481" stroke-width="1"/>
    </g>
    <g transform="translate(40, 260)">
      <text font-family="Fraunces, serif" font-style="italic" font-size="26" font-weight="500" fill="#1B1813">Start here.</text>
    </g>
    <g transform="translate(40, 310)">
      <text font-family="Inter Tight, sans-serif" font-size="16" fill="#5C5448">Drop in one thing</text>
      <text y="26" font-family="Inter Tight, sans-serif" font-size="16" fill="#5C5448">you want to do today.</text>
      <text y="62" font-family="Inter Tight, sans-serif" font-size="16" fill="#5C5448" font-style="italic">don't overthink it.</text>
    </g>
    <g transform="translate(40, 470)">
      <text font-family="Inter Tight, sans-serif" font-size="15" font-weight="500" fill="#7CA481">+ add something</text>
    </g>
  </g>
</svg>
