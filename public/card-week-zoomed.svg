      <text x="20" y="92" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">All-hands</text>
      <text x="20" y="108" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">3:00 pm</text>
