      <text x="142" y="0" font-family="Inter Tight, sans-serif" font-size="10" fill="#9A917F" letter-spacing="0.18em" font-weight="600">MAY 11</text>
      <line x1="0" y1="14" x2="180" y2="14" stroke="#EAEAEA" stroke-width="0.5"/>
      <circle cx="6" cy="40" r="3" fill="#9A917F" opacity="0.5"/>
      <text x="20" y="44" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Team standup</text>
      <text x="20" y="60" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">9:00 am</text>
      <circle cx="6" cy="88" r="3" fill="#9A917F" opacity="0.5"/>
      <text x="20" y="92" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Pilates with Mia</text>
      <text x="20" y="108" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">11:00 am</text>
