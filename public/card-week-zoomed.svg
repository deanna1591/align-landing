      <text x="132" y="0" font-family="Inter Tight, sans-serif" font-size="10" fill="#9A917F" letter-spacing="0.18em" font-weight="600">MAY 17</text>
      <line x1="0" y1="14" x2="170" y2="14" stroke="#EAEAEA" stroke-width="0.5"/>
      <text x="0" y="46" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F" font-style="italic">a quiet one.</text>
      <text x="0" y="90" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F" font-style="italic">+ add</text>
    </g>
  </g>
</svg>
