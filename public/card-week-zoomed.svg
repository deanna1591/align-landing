      <text x="146" y="20" font-family="Inter Tight, sans-serif" font-size="10" fill="#7CA481" letter-spacing="0.18em" font-weight="600">MAY 13</text>
      <line x1="0" y1="34" x2="180" y2="34" stroke="#7CA481" stroke-width="1"/>
      <circle cx="6" cy="60" r="3" fill="#9A917F" opacity="0.5"/>
      <text x="20" y="64" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Team standup</text>
      <text x="20" y="80" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">9:00 am</text>
