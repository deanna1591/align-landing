      <path d="M3 134 L6 137 L11 131" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="139" font-family="Inter Tight, sans-serif" font-size="14" fill="#9A917F" text-decoration="line-through">Submit invoice</text>
      <text x="0" y="180" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F" font-style="italic">+ add</text>
