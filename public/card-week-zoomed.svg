<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800">
  <title>Align week zoomed card</title>
  <defs>
    <filter id="zoom-sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#1B1813" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g transform="translate(80, 60)" filter="url(#zoom-sh)">
    <rect width="1440" height="680" rx="28" fill="#FFFFFF"/>

    <g transform="translate(50, 60)">
