      <text x="0" y="180" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F" font-style="italic">+ add</text>
    </g>

    <g transform="translate(1030, 200)">
      <text font-family="Fraunces, serif" font-size="22" fill="#1B1813">Saturday</text>
      <text x="146" y="0" font-family="Inter Tight, sans-serif" font-size="10" fill="#9A917F" letter-spacing="0.18em" font-weight="600">MAY 16</text>
      <line x1="0" y1="14" x2="180" y2="14" stroke="#EAEAEA" stroke-width="0.5"/>
      <circle cx="6" cy="40" r="3" fill="#9A917F" opacity="0.5"/>
      <text x="20" y="44" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Farmers market</text>
      <text x="20" y="60" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">8:00 am</text>
      <circle cx="6" cy="88" r="3" fill="#9A917F" opacity="0.5"/>
      <text x="20" y="92" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Eva's swim lesson</text>
      <text x="20" y="108" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">10:00 am</text>
      <text x="0" y="150" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F" font-style="italic">+ add</text>
