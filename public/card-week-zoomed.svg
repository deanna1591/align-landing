      <text x="142" y="0" font-family="Inter Tight, sans-serif" font-size="10" fill="#9A917F" letter-spacing="0.18em" font-weight="600">MAY 15</text>
      <line x1="0" y1="14" x2="180" y2="14" stroke="#EAEAEA" stroke-width="0.5"/>
      <circle cx="6" cy="40" r="3" fill="#9A917F" opacity="0.5"/>
      <text x="20" y="44" font-family="Inter Tight, sans-serif" font-size="14" fill="#1B1813">Dentist appt</text>
      <text x="20" y="60" font-family="Inter Tight, sans-serif" font-size="12" fill="#9A917F">10:30 am</text>
