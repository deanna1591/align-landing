      <text x="32" y="-2" font-family="Fraunces, serif" font-size="22" fill="#C9824A" font-weight="500">🔥 12</text>
    </g>

    <line x1="50" y1="150" x2="1390" y2="150" stroke="#F2F2F2" stroke-width="0.5"/>

    <g transform="translate(50, 200)">
