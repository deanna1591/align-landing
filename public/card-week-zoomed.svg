      <path d="M4 8 L7 11 L12 5" stroke="#7CA481" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="13" font-family="Inter Tight, sans-serif" font-size="14" fill="#5C5448" font-weight="500">2/5</text>
      <rect x="64" y="6" width="60" height="4" rx="2" fill="#F2F2F2"/>
      <rect x="64" y="6" width="24" height="4" rx="2" fill="#7CA481"/>
    </g>

    <g transform="translate(50, 110)">
